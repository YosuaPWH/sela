[package]
name = "luma-notch"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A quiet, native Rust notch for Windows: media, focus, and system status."
license = "MIT"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
sysinfo = "0.33"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Media_Control", "Win32_System_WinRT", "Win32_System_Power", "Win32_System_Threading", "Win32_Security", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug"] }
tray-icon = "0.19"
global-hotkey = "0.6"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "luma-notch"
path = "src/main.rs"
