[package]
name = "sela-notch"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "A quiet, native Rust notch for Windows: media, focus, and system status."
license = "MIT"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
sha2 = "0.10"
directories = "6"
sysinfo = "0.33"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.58", features = ["Foundation", "Media_Control", "Win32_System_WinRT", "Win32_System_Power", "Win32_System_Threading", "Win32_Security", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_LibraryLoader", "Win32_UI_Shell"] }
tray-icon = "0.19"
global-hotkey = "0.6"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[[bin]]
name = "sela-notch"
path = "src/main.rs"
