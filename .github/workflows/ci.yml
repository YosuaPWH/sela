name: Build, test, and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Fetch and verify embedded frame-capture provider
        shell: pwsh
        run: ./scripts/fetch-presentmon.ps1
      - name: Read version and validate release tag
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Cargo metadata.' }
          $version = ($metadata.packages | Where-Object { $_.name -eq 'sela-notch' }).version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Unsupported release version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match Cargo.toml version v$version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Validate packaging script syntax
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts/*.ps1) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo test --locked --all-targets --target x86_64-pc-windows-msvc
      - name: Capture real DXGI presents with embedded PresentMon
        run: cargo test --locked --target x86_64-pc-windows-msvc embedded_presentmon_captures_real_dxgi_presents -- --ignored --nocapture
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Verify static C runtime linkage
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vsRoot/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw 'Cannot locate the Visual Studio dependency inspector.' }
          $dependencies = & $dumpbin /dependents target/x86_64-pc-windows-msvc/release/sela-notch.exe
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect executable dependencies.' }
          $dependencies | Write-Output
          if ($dependencies -match '(?i)\b(?:vcruntime\d+(?:_\d+)?|msvcp\d+(?:_\d+)?|concrt\d+)\.dll\b') {
            throw 'The executable still depends on a Visual C++ redistributable DLL.'
          }
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles) | Where-Object { $_ }
          $found = $roots | ForEach-Object { Get-ChildItem (Join-Path $_ 'Inno Setup */ISCC.exe') -ErrorAction SilentlyContinue }
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not $found) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install Inno Setup.' }
          }
      - name: Package executable, portable app, and installer
        shell: pwsh
        env:
          SELA_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package-windows.ps1 -Version $env:SELA_VERSION
      - name: Test installer and uninstaller
        shell: pwsh
        env:
          SELA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/test-installer.ps1 `
            -InstallerPath "dist/release/Sela-$($env:SELA_VERSION)-setup-x64.exe" `
            -ExpectedExecutable target/x86_64-pc-windows-msvc/release/sela-notch.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Sela-windows-x64
          path: dist/release/*
          if-no-files-found: error

  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libxi-dev libgl1-mesa-dev
      - run: cargo test --locked --all-targets

  publish:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux-core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Sela-windows-x64
          path: dist/release
      - name: Verify checksums and publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SELA_VERSION: ${{ needs.windows.outputs.version }}
          SELA_PRERELEASE: ${{ needs.windows.outputs.prerelease }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$SELA_VERSION"
          (cd dist/release && sha256sum --check SHA256SUMS.txt)
          assets=(
            "Sela-$SELA_VERSION-setup-x64.exe"
            "Sela-$SELA_VERSION-windows-x64.zip"
            "sela-notch.exe"
            "SHA256SUMS.txt"
          )
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            if test "$(jq -r .isDraft release-state.json)" = false; then
              for asset in "${assets[@]}"; do
                gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx -- "$asset" > /dev/null
              done
              echo 'Release is already published; existing assets are preserved.'
              exit 0
            fi
          else
            flags=(--draft --verify-tag --title "Sela $RELEASE_TAG")
            notes="docs/releases/$RELEASE_TAG.md"
            if test -f "$notes"; then flags+=(--notes-file "$notes"); else flags+=(--generate-notes); fi
            if test "$SELA_PRERELEASE" = true; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${flags[@]}"
          fi
          for asset in "${assets[@]}"; do
            gh release upload "$RELEASE_TAG" "dist/release/$asset" --clobber
          done
          flags=(--draft=false)
          if test "$SELA_PRERELEASE" = true; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release edit "$RELEASE_TAG" "${flags[@]}"
