name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Package portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Sela | Out-Null
          Copy-Item target/release/sela-notch.exe,README.md,LICENSE,PRODUCT.md,DESIGN.md dist/Sela
          Copy-Item -Recurse docs dist/Sela
          Copy-Item -Recurse assets dist/Sela
          Compress-Archive -Path dist/Sela/* -DestinationPath dist/Sela-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Sela-windows-x64
          path: dist/Sela-windows-x64.zip

  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libx11-dev libxi-dev libgl1-mesa-dev
      - run: cargo test --locked --all-targets
